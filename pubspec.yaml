name: tripper
description: Local-first travel companion — trips, document vault, places.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  go_router: ^14.3.0
  intl: any
  uuid: ^4.5.0
  file_picker: ^8.1.2
  open_filex: ^4.5.0
  local_auth: ^2.3.0
  receive_sharing_intent: ^1.8.1
  screen_brightness: ^2.1.0
  wakelock_plus: ^1.2.5
  pdfx: ^2.6.0
  google_maps_flutter: ^2.9.0
  latlong2: ^0.9.1
  flutter_earth_globe: ^2.2.1
  image_picker: ^1.2.0
  photo_view: ^0.15.0
  http: ^1.2.0
  shared_preferences: ^2.3.2
  archive: ^3.6.1
  share_plus: ^10.1.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  google_mlkit_text_recognition: ^0.13.0
  url_launcher: ^6.3.0
  geolocator: ^13.0.2
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0

# Vendored, patched copy of flutter_earth_globe 2.2.1 — see
# third_party/flutter_earth_globe/PATCHES.md for what changed and why.
# Fixes a real bug found by reading the package source: a setState
# triggered from within build() (recentering the sphere when its
# internal canvas needs to grow past the box we gave it — which starts
# happening almost immediately on any zoom-in, since our globe already
# nearly fills its box at rest) went through Future.delayed(Duration.zero)
# instead of addPostFrameCallback, letting an unbounded number of extra
# frames pass before the widget tree settles back down during an active
# zoom gesture.
#
# Vendored, patched copy of video_thumbnail 0.5.6 — see
# third_party/video_thumbnail/PATCHES.md for what changed and why. Its
# Android build script called the removed jcenter() repository method
# and pinned an ancient (4.1.0) Android Gradle Plugin classpath, which
# fails outright against this app's AGP 9.0.1 (`Could not find method
# jcenter()`, cascading into a `kotlin-android` plugin error). Patched to
# mavenCentral() + AGP 8.7.3, matching the already-working
# sqlite3_flutter_libs dependency's own pinned classpath.
dependency_overrides:
  flutter_earth_globe:
    path: third_party/flutter_earth_globe
  video_thumbnail:
    path: third_party/video_thumbnail

flutter:
  uses-material-design: true
  generate: true

  # Journal globe texture — bundled, never fetched at runtime (offline
  # rule, SPEC §3.1.2). See assets/globe/README for provenance.
  assets:
    - assets/globe/

  # Bundled, never fetched at runtime (offline rule, SPEC §3.1.2).
  # Fraunces ships only 400/600 as statics — styles map to those exactly so
  # Flutter never synthesises a weight.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
