name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly integration run
  workflow_dispatch: {} # manual trigger for on-demand review

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Codegen (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Codegen check — no uncommitted generated-code drift
        run: git diff --exit-code -- '*.g.dart'

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Unit + widget + golden tests
        run: flutter test

  integration:
    # Nightly + tag pushes (pre-release) + manual dispatch only — real-device/emulator
    # integration tests are too slow to run on every push (see docs/plans/M4-polish.md,
    # "Testing & CI conventions").
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest # hardware-accelerated emulator out of the box
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Check integration_test suite exists
        id: check
        run: |
          if [ -d "integration_test" ] && [ -n "$(find integration_test -name '*_test.dart')" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration tests
        if: steps.check.outputs.exists == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          script: flutter test integration_test

      - name: No integration tests yet
        if: steps.check.outputs.exists == 'false'
        run: echo "No integration_test/ suite present yet — see outstanding Integration test items in docs/plans/M2-vault.md and M3-places.md. Skipping."
